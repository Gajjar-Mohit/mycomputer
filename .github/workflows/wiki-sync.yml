name: Sync Wiki to GitHub

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push Cleaned Wiki Folder to GitHub Wiki
        env:
          ACTION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the GitHub Wiki repository
          REPO_NAME="${{ github.repository }}"
          git clone "https://x-access-token:${ACTION_TOKEN}@github.com/${REPO_NAME}.wiki.git" wiki_repo
          
          # 1. Clean existing wiki content (preserving .git history)
          rm -rf wiki_repo/*
          
          # 2. Copy fresh wiki files from local wiki/ directory
          cp -r wiki/* wiki_repo/
          
          # 3. Stage all additions, changes, and deletions (-A)
          cd wiki_repo
          git add -A
          
          # 4. Commit and push cleaned wiki to GitHub
          if git diff-index --quiet HEAD; then
            echo "Wiki is already up to date."
          else
            git commit -m "Clean and sync wiki from main repo (${{ github.sha }})"
            git push origin master || git push origin main
          fi
